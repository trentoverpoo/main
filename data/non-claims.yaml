# Tier 4. Things the record expressly declines to claim, plus the threads the
# September 2026 review closed. None of these is drawn as a node or an edge — they
# reach the interface as text, in the "What this map does not claim" panel.

notClaimed:
  - title: No Sho-Me agreement
    body: >
      No Sho-Me entity is claimed to have contracted with Lumon, NSI or STN. Adjacency and
      an easement are documented; a transaction is not.
  - title: No Benton County power agreement
    body: >
      Aquila/Evergy and Central Electric Power Cooperative own the two tracts across the
      road from the Warsaw parcel. Nothing shows either has an agreement with NSI 6.
  - title: No price for the Warsaw parcel
    body: >
      The deeds state no price and no lender instrument has been located. Nothing here
      claims NSI 6 paid any particular amount, or that the purchase was or was not financed.
  - title: "\"Cold Storage\" is not interpreted"
    body: >
      The facility name on DNR permit MORA30685 is on the permit. What it refers to is not
      established.
  - title: The Marshfield tenant is not identified
    body: >
      STN owns the equipment. No lease is in the record, and NSI 6 is on record resisting
      disclosure of prospective lessees. The map shows equipment ownership, not tenancy.
  - title: Shared professional addresses are not common control
    body: >
      A law firm, a registered-agent suite and a Kansas resident-agent office are drawn as
      locations, never as control. Co-location is not connection.
  - title: The Owens Corning investment is not asserted
    body: >
      Northstar's own timeline claims an Owens Corning $5M Series A. A materials
      collaboration is externally confirmed; the investment attribution is not, and is not
      drawn.
