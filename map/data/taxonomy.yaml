# Legend taxonomy. Colour is assigned from three validated hues plus a neutral;
# shape and fill carry the remaining distinctions, so no category is identified
# by colour alone. See map/SCHEMA.md.

hueFamilies:
  - key: principals
    label: Principals, entities & trusts
    note: People, the single-purpose entities they form, and the vehicles that hold assets.
  - key: counterparties
    label: Operating businesses & infrastructure
    note: Businesses, lenders and utilities transacting with the entities on the left.
  - key: public
    label: Public bodies & proceedings
    note: Governments, agencies and the two live cases.
  - key: places
    label: Land & addresses
    note: Parcels, sites and the addresses that recur across filings.

categories:
  - key: person
    label: Person
    family: principals
    shape: circle
    fill: solid
  - key: project-entity
    label: Project entity (SPV)
    family: principals
    shape: square
    fill: solid
    note: Single-purpose entities formed for a specific site or transaction.
  - key: holding
    label: Holding entity or trust
    family: principals
    shape: square
    fill: hollow
    note: Vehicles whose documented role is to hold land or other entities.
  - key: outside-company
    label: Outside company
    family: counterparties
    shape: square
    fill: solid
  - key: financial
    label: Financial institution
    family: counterparties
    shape: square
    fill: hollow
    note: Banks and secured parties appearing on recorded liens.
  - key: utility
    label: Utility or cooperative
    family: counterparties
    shape: hexagon
    fill: solid
  - key: government
    label: Government body
    family: public
    shape: hexagon
    fill: solid
  - key: litigation
    label: Litigation
    family: public
    shape: diamond
    fill: solid
  - key: site
    label: Land, site or address
    family: places
    shape: diamond
    fill: hollow

connectionTypes:
  - key: ownership
    label: Ownership & governance
    note: Membership, management, signature in a stated capacity, parent/subsidiary.
  - key: conveyance
    label: Land conveyance
    note: Deeds and transfers of title.
  - key: finance
    label: Financing & liens
    note: Deeds of trust, UCC filings, equipment finance, terminations.
  - key: legal
    label: Legal & regulatory
    note: Litigation parties, permits, moratoria, agency records.
  - key: professional
    label: Professional services
    note: Counsel, registered agents, organizers, title companies, notaries.
  - key: adjacency
    label: Adjacency & location
    note: Neighbouring parcels and shared addresses. Location is not a transaction.
  - key: commercial
    label: Commercial & operational
    note: Equipment supply, tenancy, rentals, acquisitions.

# ---------------------------------------------------------------------------
# The three builds.
#
# The map opens on one of these rather than on all 88 entities at once, because
# the whole file at once is the one view nobody can read. A project is an
# editorial grouping and not a documented relationship, so it is declared here
# and tagged onto connections in relationships.yaml — it never becomes an entity
# or an edge of its own, and nothing on the canvas is drawn because of it.
#
# `anchor` is the site the build is read from: the entity a focused view centres
# on. `default` marks the one the map opens on.
projects:
  - key: marshfield
    label: Marshfield
    anchor: site-marshfield
    default: true
    note: >
      Ten acres off Rifle Range Road, the deepest-documented of the three — chain
      of title, financing, equipment, permits and the July fire response.
  - key: springfield
    label: Springfield
    anchor: site-springfield
    note: >
      2900 S. National Avenue, where the build has not started: an ordinance
      barring the use, a suit challenging it, and a utility declining to process
      the service application.
  - key: benton
    label: Benton County
    anchor: site-benton
    note: >
      Twelve acres off Old Hwy 65 at Warsaw, assembled from three Hilty family
      trusts, with a county moratorium and a second suit against it.

# ---------------------------------------------------------------------------
# The opening layout.
#
# The map opens on this arrangement rather than on wherever a cold simulation
# happens to converge: the three data centers across the top, and everything
# the record places beneath them in bands that descend by how close a party
# stands to the decisions. Bands are drawn as courses, top to bottom, in order;
# within a course the order here is the reading order, left to right, and each
# name then settles under whatever it connects to.
#
# This decides where nodes open, and — because nothing rearranges them
# afterwards — where they stay: dragging one moves that node and no other.
# The build fails if any node is named twice or left out.
hierarchy:
  - key: sites
    label: The three data centers
    note: >
      The locations themselves. Everything below is read as standing under one of
      them. Marshfield sits in the middle because it is what the map opens on.
    rows:
      - [site-springfield, site-marshfield, site-benton]

  - key: principals
    label: Principals
    note: The people who appear on the record as directing the projects.
    rows:
      - [cameron-g-jones, trenton-overhue, ashton-owens]

  - key: control
    label: Control and holding vehicles
    note: What the principals manage or hold through.
    rows:
      - [lumon-solutions-management, nsi-investments]

  - key: titleholders
    label: Entities holding title
    note: The single-purpose entities named as owner on the deeds and permits.
    rows:
      - [lumon-solutions-marshfield, nsi-a1, nsi-6]

