<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sources · Southwest Missouri Data Center Map</title>
<meta name="description" content="Every document the map depends on, and what each one supports. The map inverted: start from a source, see what rests on it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='3' fill='%233987e5'/><circle cx='3' cy='3' r='1.6' fill='%23d95926'/><circle cx='13' cy='4' r='1.6' fill='%23199e70'/><circle cx='4' cy='13' r='1.6' fill='%23199e70'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="sources">
<main class="sources-wrap">
  <p style="margin:0 0 20px"><a href="index.html">← Back to the map</a></p>
  <h1>Sources</h1>
  <input id="doc-filter" type="search" placeholder="Filter by path or by what it supports…"
         autocomplete="off" spellcheck="false" aria-label="Filter documents">
  <p class="note" id="doc-count" role="status" style="margin-bottom:18px"></p>
  <div id="docs"></div>
</main>

<script src="data/graph.js"></script>
<script>
(function () {
'use strict';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const host = document.getElementById('docs');
const filter = document.getElementById('doc-filter');
const count = document.getElementById('doc-count');

const data = window.__GRAPH__;
if (!data) {
  host.innerHTML = '<p class="note">map/data/graph.js is missing or failed to load. ' +
    'Run: node build/build.mjs</p>';
  return;
}

const hostOf = (url) => {
  const m = /^https?:\/\/([^/?#]+)/i.exec(String(url || ''));
  return m ? m[1].replace(/^www\./, '') : String(url || '');
};

// Collapse repeated references to the same node or edge.
const docs = data.documents.map((d) => {
  const seen = new Map();
  for (const ref of d.refs) if (!seen.has(ref.id)) seen.set(ref.id, ref);
  return { path: d.path, url: d.url || null, urlLabel: d.urlLabel || null, refs: [...seen.values()] };
});

function render(q) {
  const s = (q || '').trim().toLowerCase();
  const rows = docs.filter((d) =>
    !s || d.path.toLowerCase().includes(s) ||
    (d.url || '').toLowerCase().includes(s) ||
    d.refs.some((r) => r.name.toLowerCase().includes(s)));

  const live = docs.filter((d) => d.url).length;
  count.textContent = `${rows.length} of ${docs.length} documents · ` +
    `${data.meta.nodeCount} entities and ${data.meta.edgeCount} connections depend on them · ` +
    `${live} also have a live source`;

  host.innerHTML = rows.map((d) => `
    <div class="doc-row">
      <a class="doc-path" href="${esc(encodeURI(d.path))}" target="_blank" rel="noopener">${esc(d.path)}</a>
      ${d.url ? `<div class="doc-live-row"><a class="doc-live" href="${esc(d.url)}"
        target="_blank" rel="noopener noreferrer"><span class="live-tag">Live</span>${
        esc(d.urlLabel || hostOf(d.url))}</a></div>` : ''}
      <div class="doc-refs">${d.refs.map((r) =>
        `<span class="doc-ref ${r.kind === 'edge' ? 'edge' : ''}">${esc(r.name)}</span>`).join('')}
      </div>
    </div>`).join('') || '<p class="note">Nothing matches that filter.</p>';
}

filter.addEventListener('input', () => render(filter.value));

try {
  const t = localStorage.getItem('map-theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch (e) { /* private mode */ }

render('');
}());
</script>
</body>
</html>
